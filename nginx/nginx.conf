# =====================================================================
# NGINX - ponto de entrada ÚNICO da aplicação (o mesmo arquivo é usado no
# Docker Compose e no Kubernetes).
#
#   /                -> front-end estático (html/)
#   /api/...         -> reverse proxy para o Serviço A
#   /api/health/...  -> 404 (health checks são internos, não públicos)
#
# Roda na imagem nginxinc/nginx-unprivileged: usuário comum, porta 8080.
# =====================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;                 # não revela a versão do NGINX
  client_max_body_size 16k;          # corpo dos pedidos é pequeno

  # usuário sem root: arquivos temporários em /tmp
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Log de acesso em JSON, com o mesmo request_id que vai para o Serviço A
  log_format json escape=json '{"time":"$time_iso8601","servico":"nginx","evento":"http.requisicao",'
    '"requestId":"$request_id","cliente":"$remote_addr","metodo":"$request_method",'
    '"caminho":"$request_uri","status":$status,"ms":$request_time,'
    '"upstream":"$upstream_addr","upstreamMs":"$upstream_response_time"}';
  access_log /dev/stdout json;

  # LIMITE DE REQUISIÇÕES POR IP: um cliente sozinho não consome toda a capacidade.
  # Acima do limite (com folga de rajada), responde 429 Too Many Requests.
  limit_req_zone $binary_remote_addr zone=api_por_ip:10m rate=50r/s;
  limit_req_status 429;

  upstream servico_a {
    server servico-a:3000;           # nome do serviço na rede interna (Compose ou Service do K8s)
    keepalive 32;                    # reaproveita conexões HTTP/1.1 com o Node
    keepalive_timeout 60s;           # MENOR que o keepAliveTimeout do Node (65 s): evita 502 intermitente
  }

  server {
    listen 8080;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # cabeçalhos de segurança
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # health do próprio NGINX (usado pelo Docker/Kubernetes)
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # health checks da API não são públicos
    location /api/health/ {
      return 404;
    }

    location /api/ {
      limit_req zone=api_por_ip burst=200 nodelay;

      # SEM barra no final: preserva o caminho /api/relatorios ao repassar
      proxy_pass http://servico_a;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Request-Id      $request_id;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;

      # Tenta outra réplica em caso de falha SÓ para métodos seguros (GET).
      # O NGINX nunca repete um POST sozinho (non_idempotent não está na lista):
      # repetir um POST já executado poderia criar um relatório duplicado.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
