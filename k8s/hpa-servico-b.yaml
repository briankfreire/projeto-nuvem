# Etapa 3: ELASTICIDADE do Serviço B (fora do kustomization de propósito).
# Aplicar SÓ depois dos experimentos de escala manual:
#   kubectl apply -f k8s/hpa-servico-b.yaml
#
# Réplicas desejadas = ceil(réplicas atuais x utilização atual / 50%)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: servico-b
  namespace: wattreport
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: servico-b
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Pods, value: 2, periodSeconds: 15 }
    scaleDown:
      stabilizationWindowSeconds: 60   # padrão é 300 s; reduzido para a demonstração
      policies:
        - { type: Pods, value: 1, periodSeconds: 30 }
