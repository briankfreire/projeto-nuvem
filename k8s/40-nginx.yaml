# NGINX da aplicação: mesma configuração do Compose (nginx.conf e html/ viram ConfigMaps).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels: { app: nginx }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # usuário nginx da imagem unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: NGINX_ENTRYPOINT_QUIET_LOGS, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: html, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
        - name: html
          configMap: { name: nginx-html }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: ClusterIP
  selector: { app: nginx }
  ports:
    - { name: http, port: 80, targetPort: http }
